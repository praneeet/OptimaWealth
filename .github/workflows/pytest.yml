name: OptimaWealth Unit Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run unit tests with pytest
      env:
        PYTHONPATH: .
      run: |
        python -c "import sys; print('System Path:', sys.path)"
        python -c "import src.database; import src.categorizer; import src.optimizer; import src.forecasting; import src.utils; print('All src modules imported successfully!')"
        python tests/run_tests.py


